<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sengol Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="section"><div class="container"><a href="index.html">← Back to website</a><div class="section-heading"><p class="section-label">SENGOL ADMIN</p><h1>Product Dashboard</h1><p>Add, edit and delete products stored in this browser.</p></div><form id="productForm" class="panel"><input id="productName" required placeholder="Product name"><select id="productCategory" required><option value="">Category</option><option>Fashion</option><option>Electronics</option><option>Home Decor</option><option>Other</option></select><input id="productPrice" placeholder="Price"><input id="productDiscount" placeholder="Discount e.g. 20% OFF"><input id="productImage" type="url" placeholder="Product image URL"><textarea id="productDescription" required placeholder="Description"></textarea><input id="affiliateLink" type="url" required placeholder="Authorized affiliate/product URL"><select id="productRating"><option>5</option><option>4.5</option><option>4</option><option>3.5</option><option>3</option></select><label><input id="isTrending" type="checkbox"> Trending</label><label><input id="isFeatured" type="checkbox"> Featured</label><div class="actions"><button id="submitBtn" class="btn primary" type="submit">Add Product</button><button id="clearBtn" class="btn secondary" type="button">Clear</button></div></form><div class="toolbar"><input id="searchProducts" placeholder="Search admin products..."></div><div id="productList"></div></div></main><script src="admin.js"></script></body></html>
